<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AriOne - Recuperar senha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --pri:#0891B2; --pri-d:#075985; --bg:#E6F9FC; --text:#183b56; --border:#cbeaf0; }
        * { box-sizing:border-box; }
        body { min-height:100vh; margin:0; display:flex; align-items:center; justify-content:center; padding:20px; background:linear-gradient(135deg,#E6F9FC,#f8fdfe); font-family:Inter,'Segoe UI',sans-serif; color:var(--text); }
        .box { width:min(430px,100%); background:#fff; border:1px solid var(--border); border-radius:16px; padding:34px; box-shadow:0 18px 45px rgba(8,145,178,.13); }
        .brand { color:var(--pri); font-size:1.5rem; font-weight:900; margin-bottom:24px; }
        h1 { margin:0 0 8px; font-size:1.45rem; color:var(--pri-d); }
        p { color:#6d8495; line-height:1.6; font-size:.92rem; margin:0 0 22px; }
        label { display:block; margin-bottom:7px; color:#397078; font-size:.82rem; font-weight:800; }
        input { width:100%; padding:13px 14px; border:1px solid var(--border); border-radius:9px; font-size:1rem; color:var(--text); }
        input:focus { outline:0; border-color:var(--pri); box-shadow:0 0 0 3px rgba(6,182,212,.14); }
        button { width:100%; margin-top:16px; padding:13px; border:0; border-radius:9px; background:linear-gradient(135deg,var(--pri),#06B6D4); color:#fff; font-weight:800; cursor:pointer; }
        .back { display:block; margin-top:18px; text-align:center; color:var(--pri); font-weight:700; font-size:.86rem; text-decoration:none; }
        .flash { margin-bottom:16px; padding:11px; border-radius:8px; background:#e8f8f5; border:1px solid #b7eadf; color:#17675e; font-size:.86rem; }
        .flash.danger { background:#fff5f5; border-color:#fed7d7; color:#c53030; }
        .flash.warning { background:#fffbeb; border-color:#fbd38d; color:#744210; }
    </style>
</head>
<body>
    <main class="box">
        <div class="brand">AriOne</div>
        <h1>Recuperar senha</h1>
        <p>Informe seu e-mail. Se ele estiver cadastrado, enviaremos um link seguro para criar uma nova senha.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
        {% endwith %}
        <form method="POST">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required autofocus>
            <button type="submit"><i class="fas fa-paper-plane"></i> Enviar instruções</button>
        </form>
        <a class="back" href="{{ url_for('auth.login') }}"><i class="fas fa-arrow-left"></i> Voltar para o login</a>
    </main>
</body>
</html>
