<div class="card-deploy-servidor" style="padding: 18px; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px;">
        <div style="display:flex; align-items:center; gap:12px;">
            <div style="width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color:#fff;">
                <i class="fas fa-server"></i>
            </div>
            <div>
                <div style="font-size:10px; font-weight:800; letter-spacing:1.2px; color:#64748b; text-transform:uppercase;">Deploy</div>
                <h3 style="margin: 3px 0 0; font-size: 1.1rem; font-weight: 800; color:#1e293b;">Servidores Render</h3>
            </div>
        </div>
        <span style="display:inline-flex; align-items:center; justify-content:center; padding:7px 12px; border-radius:999px; background:#ecfdf5; color:#166534; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.8px;">
            {{ servicos|length }} serviço(s)
        </span>
    </div>

    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:16px;">
        {% for servico in servicos %}
        <div style="border:1px solid #e2e8f0; border-radius:12px; padding:16px; background:#f8fafc;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="width:10px; height:10px; border-radius:50%; display:inline-block; background: {{ '#22c55e' if servico.status == 'ativo' else '#f59e0b' }};"></span>
                    <strong style="font-size:0.96rem; color:#1e293b;">{{ servico.nome }}</strong>
                </div>
                <span style="font-size:10px; font-weight:800; letter-spacing:1px; text-transform:uppercase; background: #e2e8f0; color:#475569; border-radius:999px; padding:6px 10px;">
                    {{ servico.tipo }}
                </span>
            </div>

            <div style="display:grid; gap:8px; color:#475569; font-size:12px; line-height:1.5;">
                <div><strong>Branch:</strong> {{ servico.branch }}</div>
                <div><strong>Status:</strong> {{ servico.status }}</div>
                <div><strong>Banco:</strong> {{ servico.banco }}</div>
                <div><strong>URL:</strong> <a href="{{ servico.url }}" target="_blank" rel="noopener" style="color:#2563eb; text-decoration:none;">{{ servico.url }}</a></div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
