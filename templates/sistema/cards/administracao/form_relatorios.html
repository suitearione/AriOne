{% extends "base.html" %}

{% block content %}
<div class="arione-page-wrapper" style="padding: 22px; background: #f8fafc; min-height: 100vh;">
    <div style="max-width: 980px; margin: 0 auto;">
        <div style="background: linear-gradient(90deg, #2980B9 0%, #1F5F8A 100%); border-radius: 14px 14px 0 0; padding: 18px 22px; color: #fff; box-shadow: 0 10px 30px rgba(41, 128, 185, 0.18);">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:14px;">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div style="width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; background: rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.13);">
                        <i class="fas fa-file-alt"></i>
                    </div>
                    <div>
                        <div style="font-size:11px; letter-spacing:1.2px; text-transform:uppercase; font-weight:800; opacity:0.9;">Sistema</div>
                        <h2 style="margin: 4px 0 0; font-size: 1.4rem; font-weight: 800;">Relatórios Administrativos</h2>
                    </div>
                </div>
                <a href="{{ url_for('sistema.abas') }}" style="display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:10px; background: rgba(255,255,255,0.12); color:#fff; text-decoration:none; border:1px solid rgba(255,255,255,0.15);">
                    <i class="fas fa-arrow-left"></i>
                </a>
            </div>
        </div>

        <div style="background:#fff; border:1px solid #e2e8f0; border-top:none; border-radius:0 0 14px 14px; padding: 24px; box-shadow: 0 12px 25px rgba(15, 23, 42, 0.04);">
            <form method="GET" action="#" style="display:grid; gap:18px;">
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:16px;">
                    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:16px;">
                        <label style="display:block; font-size:10px; font-weight:800; letter-spacing:1px; color:#64748b; text-transform:uppercase; margin-bottom:10px;">Tipo de relatório</label>
                        <select style="width:100%; border:1px solid #dfe7ef; border-radius:8px; padding:10px; background:#fff; color:#1e293b;">
                            <option>Resumo Geral</option>
                            <option>Registro de Atividades</option>
                            <option>Usuários e Permissões</option>
                            <option>Backup e Sistema</option>
                        </select>
                    </div>
                    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:16px;">
                        <label style="display:block; font-size:10px; font-weight:800; letter-spacing:1px; color:#64748b; text-transform:uppercase; margin-bottom:10px;">Período</label>
                        <input type="text" value="Últimos 30 dias" style="width:100%; border:1px solid #dfe7ef; border-radius:8px; padding:10px; background:#fff; color:#1e293b;" />
                    </div>
                    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:16px;">
                        <label style="display:block; font-size:10px; font-weight:800; letter-spacing:1px; color:#64748b; text-transform:uppercase; margin-bottom:10px;">Área</label>
                        <select style="width:100%; border:1px solid #dfe7ef; border-radius:8px; padding:10px; background:#fff; color:#1e293b;">
                            <option>Geral</option>
                            <option>Gestão</option>
                            <option>Operações</option>
                            <option>Financeiro</option>
                            <option>Produção</option>
                        </select>
                    </div>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;">
                    <button type="button" style="padding:10px 16px; border:1px solid #dfe7ef; background:#fff; color:#475569; border-radius:8px; font-weight:700; cursor:pointer;">Limpar</button>
                    <button type="submit" style="padding:10px 16px; border:none; background:#2980B9; color:#fff; border-radius:8px; font-weight:700; cursor:pointer;">Gerar relatório</button>
                </div>
            </form>

            <div style="margin-top: 24px; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; background:#f8fafc;">
                <div style="padding:12px 16px; background:#eef6fc; border-bottom:1px solid #dfe7ef; font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#1f5f8a;">
                    Visualização do relatório
                </div>
                <div style="padding: 20px; color:#475569; line-height:1.7;">
                    Nenhum resultado gerado ainda. A rota atual apenas prepara o layout da administração de relatórios e aguarda a continuidade do módulo correspondente.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
